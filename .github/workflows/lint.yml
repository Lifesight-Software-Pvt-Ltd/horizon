name: Lint

# Runs black, flake8 and bandit on every pull request and on pushes to
# main. This is the only automated check that gates a PR: the model test suite fits real backends
# and takes 25-60 minutes per Python version, so it is run locally by
# contributors and maintainers rather than in CI (see CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Newest supported version on purpose: pycodestyle tokenizes
          # f-string interiors on 3.12+, so this catches E201/E202 that
          # older interpreters let through.
          python-version: "3.13"
      - name: Install linters
        run: pip install black flake8 bandit
      - name: black --check
        run: black --check --diff .
      - name: flake8
        run: flake8 .
      - name: bandit
        run: bandit -c pyproject.toml -r horizon_forecaster
