version: 2
updates:
  # Keep the actions used by lint.yml current. These are the only
  # third-party code that runs with repository access.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  # Runtime pins are deliberate and several are load-bearing (see the
  # comments in pyproject.toml), so these PRs are proposals to evaluate,
  # not auto-merges. Security updates are the main reason to have this:
  # SECURITY.md documents known CVEs in the torch tree that neuralprophet
  # currently pins us to, and this is how a fix upstream becomes visible.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    ignore:
      # neuralprophet 0.8.0 declares numpy>=1.25,<2, so any numpy 2.x bump
      # is unresolvable. Lift when NeuralProphet accepts numpy 2.
      - dependency-name: "numpy"
        versions: [">=2.0.0"]
      # setuptools 82 removed pkg_resources, which pytorch-lightning (via
      # neuralprophet) imports at runtime. The <82 bound in pyproject.toml
      # is load-bearing; see the comment there.
      - dependency-name: "setuptools"
        versions: [">=82.0.0"]
      # 0.9.0 drops Python 3.13 (requires-python <=3.12) and still pins
      # numpy<2, so it gains nothing. CONTRIBUTING.md records that
      # unpinning NeuralProphet was evaluated and turned down.
      - dependency-name: "neuralprophet"
        versions: [">0.8.0"]
