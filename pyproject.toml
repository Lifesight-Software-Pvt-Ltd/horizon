[build-system]
# 77 is the floor, not a preference: `license = "Apache-2.0"` below is a
# PEP 639 SPDX expression, and setuptools only understands the bare-string
# form from 77.0.0. Older versions reject it outright --
#   invalid pyproject.toml config: `project.license`
#   must be valid exactly by one definition ('file' or 'text')
# -- because they expect the legacy {file = ...} / {text = ...} table.
#
# A plain `pip install .` hides this: pip builds in an isolated
# environment and resolves a current setuptools regardless of what the
# bound says. The failure surfaces on a --no-isolation build, or anywhere
# the build backend is pinned lower. Declaring the real requirement is
# what stops that being a confusing error rather than a clear one.
#
# Unrelated to the `setuptools>=68,<82` RUNTIME pin further down, which
# exists because pytorch-lightning imports pkg_resources at import time.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon_forecaster"
version = "1.0.0"
description = "Ensemble time-series forecasting across Prophet, NeuralProphet, SARIMAX, CatBoost, and Bayesian PyMC"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Lifesight" }]
keywords = [
    "forecasting",
    "time-series",
    "ensemble",
    "prophet",
    "sarimax",
    "catboost",
    "neuralprophet",
    "pymc",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas==2.3.3",
    # Pinned by NeuralProphet, not by us: neuralprophet 0.8.0 declares
    # numpy>=1.25.0,<2.0.0. numpy ships no 3.13 wheel for the 1.x line
    # (its first 3.13 build is 2.1.0), so on 3.13 pip compiles this from
    # source -- slower to install, slower BLAS, and it needs a toolchain.
    # Verified working on Linux x86-64 and macOS arm64; see docs/installation.md.
    # Lifts when NeuralProphet accepts numpy 2.
    "numpy==1.26.4",
    "prophet==1.5.0",
    "neuralprophet==0.8.0",
    "statsmodels==0.14.6",
    "catboost==1.2.10",
    "pymc==5.25.1",
    # Pinned to the 3.10.x line specifically: matplotlib 3.11.0 (the
    # version that resolved naturally on a Python 3.12 machine) already
    # dropped Python 3.10 support, which broke CI's 3.10 matrix job.
    # 3.10.6 is confirmed available for Python 3.10 (from the actual pip
    # resolver error log) and matplotlib's own version-support policy
    # covers multiple consecutive Python minor versions per release, so
    # this also installs cleanly on 3.11/3.12.
    "matplotlib==3.10.6",
    "pyyaml==6.0.3",
    # Explicit dependency, not just a build-system requirement: some
    # transitive dependencies (pytorch_lightning, via neuralprophet)
    # import pkg_resources at runtime, which isn't guaranteed present in
    # every fresh Python environment (confirmed failure on a Python 3.12
    # GitHub Actions runner). The upper bound is NOT optional: setuptools
    # 82.0.0 (released Feb 8, 2026) completely removed pkg_resources from
    # the package — a loose ">=68" bound was tried first and failed for
    # exactly this reason, since pip satisfied it with 82+, which no
    # longer has the module at all. Confirmed fix via multiple
    # independent upstream bug reports converging on the same pin.
    "setuptools>=68,<82",
]

[project.urls]
Homepage = "https://github.com/Lifesight-Software-Pvt-Ltd/horizon"
Repository = "https://github.com/Lifesight-Software-Pvt-Ltd/horizon"
Changelog = "https://github.com/Lifesight-Software-Pvt-Ltd/horizon/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Lifesight-Software-Pvt-Ltd/horizon/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "bandit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.bandit]
# Security lint over the package only. Tests are excluded: they assert,
# monkeypatch and write temp files on purpose. The handful of deliberate
# pickle / torch.load / try-except-pass sites in the package carry inline
# `# nosec BXXX` markers with the reason beside them, so a new occurrence
# anywhere else still fails the scan.
exclude_dirs = ["tests"]

[tool.setuptools.packages.find]
# Explicit include list, rather than relying on setuptools' automatic
# flat-layout discovery. Without this, ANY stray top-level folder in the
# project root (a venv named "test_env", a build artifact like
# "catboost_info", etc.) gets mistaken for a second package and the
# build fails outright — confirmed to happen in practice, not
# theoretical. This makes the build robust regardless of what a
# contributor happens to name their virtual environment.
include = ["horizon_forecaster", "horizon_forecaster.*"]

[tool.setuptools.package-data]
# Without this, non-.py files (like the YAML config) are silently
# excluded from the actual built/distributable package — confirmed by
# inspecting a real built wheel, which contained zero .yaml files despite
# editable installs (pip install -e .) working fine throughout
# development. Editable installs symlink to the source tree and don't
# expose this gap; only a real wheel build does.
horizon_forecaster = ["config/*.yaml"]