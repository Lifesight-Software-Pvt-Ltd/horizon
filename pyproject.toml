[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon_forecaster"
version = "0.0.1"
description = "Ensemble time-series forecasting across Prophet, NeuralProphet, SARIMAX, CatBoost, and Bayesian PyMC"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pandas==2.3.3",
    "numpy==1.26.4",
    "prophet==1.3.0",
    "neuralprophet==0.8.0",
    "statsmodels==0.14.6",
    "catboost==1.2.10",
    "pymc==5.25.1",
    # Pinned to the 3.10.x line specifically: matplotlib 3.11.0 (the
    # version that resolved naturally on a Python 3.12 machine) already
    # dropped Python 3.10 support, which broke CI's 3.10 matrix job.
    # 3.10.6 is confirmed available for Python 3.10 (from the actual pip
    # resolver error log) and matplotlib's own version-support policy
    # covers multiple consecutive Python minor versions per release, so
    # this also installs cleanly on 3.11/3.12.
    "matplotlib==3.10.6",
    "pyyaml==6.0.3",
    # Explicit dependency, not just a build-system requirement: some
    # transitive dependencies (pytorch_lightning, via neuralprophet)
    # import pkg_resources at runtime, which isn't guaranteed present in
    # every fresh Python environment (confirmed failure on a Python 3.12
    # GitHub Actions runner). The upper bound is NOT optional: setuptools
    # 82.0.0 (released Feb 8, 2026) completely removed pkg_resources from
    # the package — a loose ">=68" bound was tried first and failed for
    # exactly this reason, since pip satisfied it with 82+, which no
    # longer has the module at all. Confirmed fix via multiple
    # independent upstream bug reports converging on the same pin.
    "setuptools>=68,<82",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]