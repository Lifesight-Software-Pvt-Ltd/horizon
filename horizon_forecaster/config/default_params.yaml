# Default hyperparameters, by model and frequency.
#
# Structure, per model/frequency block:
#   hyperparameter_grid: a LIST of candidate hyperparameter sets. When no
#                        explicit model_params override is given by the
#                        caller, Horizon fits EVERY candidate on the
#                        training window and selects whichever achieves the
#                        lowest score on the VALIDATION window (MAPE, or WAPE
#                        when the forecaster's selection_metric is "wape").
#
#                        Note "validation", not "test". Candidates are
#                        chosen on a window that exists only for choosing;
#                        the test window is scored once, afterwards, by the
#                        winner refit on train+validation, and no selection
#                        path is ever allowed to read it. A single
#                        held-out window doing both jobs would make every
#                        reported MAPE a selection score and therefore
#                        optimistic.
#
#                        Grid SIZE and composition are per-model, not a
#                        shared convention: prophet, sarimax and
#                        neuralprophet have 6 candidates, catboost 18,
#                        bayesianpymc 4 daily / 3 weekly. Each model's own
#                        block explains its own grid -- nothing here
#                        generalises across them.
#   base_hyperparameters: settings applied to EVERY candidate in the
#                        grid, not varied by the search.
#   wrapper_config:      settings consumed by horizon_forecaster's own
#                        wrapper logic, NOT passed to the underlying
#                        library (minimum-rows floor, random seed).
#
# An explicit `model_params` override (passed to HorizonForecaster's
# constructor) always skips the grid search entirely and uses exactly
# what was passed, merged on top of base_hyperparameters.
#
# Only daily/weekly are supported currently, per project scope.

# Prophet's grid: 6 candidates per frequency. The first 4 are settings
# validated on real datasets with enough history to support them. The last 2 use
# yearly_seasonality='auto' -- Prophet's own data-span-aware setting, which
# safely disables yearly seasonality when there isn't enough history for it
# rather than forcing it on regardless.
#
# That distinction is load-bearing, not stylistic: forcing an explicit
# yearly_seasonality Fourier order on a dataset shorter than ~1-2 years was
# confirmed (via direct testing) to produce wild, unconstrained
# extrapolation -- including negative forecasted values for a strictly
# positive metric -- because Prophet has nowhere near enough data to
# constrain a yearly cycle but tries to fit one anyway. Including 'auto'
# candidates lets the grid search itself favour the safe fallback on short
# datasets (where it scores better) and the tuned aggressive settings on
# long ones, rather than hand-coding a data-span threshold.
prophet:
  daily:
    base_hyperparameters:
      daily_seasonality: false
      # Prophet's own interval is never used: HorizonForecaster gives every
      # model a calibrated 95% band (evaluation/bands.py). 0 skips the
      # interval simulation Prophet would otherwise run on every predict().
      uncertainty_samples: 0
    hyperparameter_grid:
      - seasonality_mode: additive
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: multiplicative
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: additive
        yearly_seasonality: 20
        weekly_seasonality: 5
      - seasonality_mode: multiplicative
        yearly_seasonality: 20
        weekly_seasonality: 5
      # Safe fallback candidates for shorter datasets — see note above.
      - seasonality_mode: additive
        yearly_seasonality: auto
        weekly_seasonality: auto
      - seasonality_mode: multiplicative
        yearly_seasonality: auto
        weekly_seasonality: auto
    wrapper_config:
      # Floor: 14 days = 2 full weeks, the earliest point a weekly
      # pattern can even theoretically repeat once. Not a guarantee of a
      # good fit, just a sanity floor below which Prophet is fitting
      # noise, not a pattern.
      min_rows_required: 14
      random_seed: 42

  weekly:
    base_hyperparameters:
      daily_seasonality: false
      uncertainty_samples: 0  # see the daily block
    # NOTE: weekly_seasonality is included in the first 4 candidates for
    # consistency with the daily grid above, but is arguably not
    # meaningful at weekly granularity (each row already IS a week, so
    # there's no "within-week" pattern to detect). The safe fallback
    # candidates below explicitly disable it rather than using 'auto',
    # since we already know structurally it shouldn't apply here.
    hyperparameter_grid:
      - seasonality_mode: additive
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: multiplicative
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: additive
        yearly_seasonality: 20
        weekly_seasonality: 5
      - seasonality_mode: multiplicative
        yearly_seasonality: 20
        weekly_seasonality: 5
      # Safe fallback candidates for shorter datasets — see note above.
      - seasonality_mode: additive
        yearly_seasonality: auto
        weekly_seasonality: false
      - seasonality_mode: multiplicative
        yearly_seasonality: auto
        weekly_seasonality: false
    wrapper_config:
      # Floor: 8 weeks (~2 months), the point below which there isn't
      # enough span to estimate a trend + any real pattern, as opposed
      # to just curve-fitting a line through noise.
      min_rows_required: 8
      random_seed: 42

# CatBoost hyperparameters, by frequency.
#
# Structure mirrors the prophet block above exactly (base_hyperparameters
# / hyperparameter_grid / wrapper_config) — same generic grid-search
# mechanics in HorizonForecaster.evaluate() apply unchanged, which is
# itself a real test of whether that mechanism actually generalizes
# across genuinely different model types, not just a second copy of it.
#
# hyperparameter_grid here is the full cartesian product of the ranges
# below, validated on real data and kept as the complete 16-combination
# grid rather than a curated subset,
# plus 2 additional safe/conservative fallback candidates (see the
# note further down, next to those entries) — 18 candidates total:
#   iterations:    [500, 1000]
#   learning_rate: [0.03, 0.1]
#   depth:         [4, 6]
#   l2_leaf_reg:   [1, 3]
#
# NOTE on cost: 18 candidates is materially more expensive per
# evaluate()/forecast() call than Prophet's 6-candidate grid. Accepted
# deliberately (not an oversight) — performance/thoroughness was
# explicitly prioritized over grid-search runtime for this model.
#
# NOTE on random_seed/verbose: these are NOT part of the grid or
# base_hyperparameters, on purpose. CatBoostWrapper's constructor takes
# random_seed as an explicit wrapper-level argument (same pattern as
# ProphetWrapper) and hardcodes verbose=False directly on the
# CatBoostRegressor call. Putting either key in params too would collide
# with those and raise "got multiple values for keyword argument" —
# exactly the class of bug the explicit-constructor-argument convention
# exists to prevent (see ProphetWrapper.__init__, which documents the
# same reasoning). Both live under wrapper_config instead, never
# under base_hyperparameters/hyperparameter_grid.
catboost:
  daily:
    base_hyperparameters:
      loss_function: MAE
      # MAPE as CatBoost's own eval_metric, not just this project's
      # external evaluation metric — keeps what the model MONITORS during
      # training consistent with how it's judged afterward by evaluate().
      # (loss_function above is what it actually optimizes; eval_metric
      # only reports, and with no eval_set passed it is purely cosmetic.)
      eval_metric: MAPE
    hyperparameter_grid:
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      # Safe fallback candidates for short/small datasets — see note
      # above. Unlike Prophet's 'auto' fallback (which was added to fix
      # a confirmed, dramatic 802%-MAPE catastrophic failure), direct
      # testing here did NOT find an equally dramatic failure mode for
      # the aggressive candidates on short CatBoost data — differences
      # between aggressive and conservative candidates were marginal and
      # inconsistent across seeds (a few points of MAPE either way, not
      # an order-of-magnitude blowup). Included anyway as low-cost
      # insurance: shallower trees, fewer rounds, stronger L2
      # regularization, so the grid search has a genuinely
      # low-capacity option to fall back to if a future dataset shape
      # does trigger real overfitting that this project's own test
      # datasets didn't happen to surface.
      - iterations: 100
        learning_rate: 0.05
        depth: 2
        l2_leaf_reg: 10
      - iterations: 300
        learning_rate: 0.05
        depth: 3
        l2_leaf_reg: 8
    wrapper_config:
      # Same floor as Prophet's daily config: a raw training-row count,
      # identical in meaning to Prophet's.
      min_rows_required: 14
      random_seed: 42

  weekly:
    base_hyperparameters:
      loss_function: MAE
      eval_metric: MAPE
    hyperparameter_grid:
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      # Safe fallback candidates for short/small datasets — see the
      # matching note in the daily block above.
      - iterations: 100
        learning_rate: 0.05
        depth: 2
        l2_leaf_reg: 10
      - iterations: 300
        learning_rate: 0.05
        depth: 3
        l2_leaf_reg: 8
    wrapper_config:
      # Same floor as Prophet's weekly config.
      min_rows_required: 8
      random_seed: 42

# ---------------------------------------------------------------------------
# SARIMAX (statsmodels).
#
# Everything under base_hyperparameters is interpreted by SARIMAXWrapper
# itself (NOT passed to any statsmodels constructor blindly); wrapper_config
# carries only the two settings forecaster.py forwards explicitly
# (min_rows_required, random_seed).
#
# Annual seasonality is handled by Fourier exog terms built in the WRAPPER
# (both frequencies), so their order is grid-searchable. Daily additionally
# uses a cheap weekly SARIMAX seasonal order (s=7); weekly disables the
# SARIMAX seasonal order entirely (a real s=52 is prohibitively slow) and
# leans on the Fourier terms.
#
# SARIMAX uses this grid like every other model. A private search inside
# the wrapper (ADF for d, then a search over orders on a validation tail
# carved out of train) was considered and rejected: it would make SARIMAX
# the only model selected differently, and one mechanism for every model
# keeps the scores and the inverse-MAPE weights comparable. It would also
# protect nothing, since every model is selected on a dedicated validation
# window and reported on a test window no selection path may read (see
# this file's header).
#
# The grid varies (p, q), the seasonal (P, Q), and fourier_order_annual.
# `d` is NOT in the grid: it stays ADF-derived inside the wrapper, since it
# is a property of the data rather than a hyperparameter.
#
# fourier_order_annual (0 = no annual seasonality) is in the grid because
# real data proved no fixed default works: on a ~3-year daily series annual
# Fourier was a clear win, while on a ~2-year weekly series it was actively
# harmful, and at order 10 it diverged outright. The data has to choose.
#
# Candidates that fail (e.g. a diverging order) are skipped by the grid
# search rather than failing the whole model.
sarimax:
  daily:
    base_hyperparameters:
      log_clip_headroom: 1.5      # explosion guard: cap log yhat at the anchor + this
      clip_anchor_quantile: 0.99  # anchor that cap on a high quantile, not the raw max
      bias_correction: true       # +sigma^2/2 lognormal lift; false = median (MAPE-optimal)
      enforce_stationarity_final: true
      maxiter_final: 150
      use_seasonal: true
      seasonal_period: 7          # weekly seasonality for daily data
    hyperparameter_grid:
      - {p: 0, q: 1, P: 0, Q: 1, fourier_order_annual: 0}
      - {p: 1, q: 1, P: 0, Q: 1, fourier_order_annual: 0}
      - {p: 0, q: 1, P: 1, Q: 1, fourier_order_annual: 2}
      - {p: 1, q: 1, P: 1, Q: 1, fourier_order_annual: 2}
      - {p: 1, q: 1, P: 1, Q: 1, fourier_order_annual: 6}
      - {p: 1, q: 0, P: 0, Q: 0, fourier_order_annual: 6}
    wrapper_config:
      min_rows_required: 35
      random_seed: 42
  weekly:
    base_hyperparameters:
      log_clip_headroom: 1.5
      clip_anchor_quantile: 0.99
      bias_correction: true
      enforce_stationarity_final: true
      maxiter_final: 150
      use_seasonal: false         # a real s=52 order is prohibitively slow; annual
      seasonal_period: 52         # structure comes from the Fourier terms instead
    hyperparameter_grid:
      - {p: 0, q: 1, fourier_order_annual: 0}
      - {p: 1, q: 1, fourier_order_annual: 0}
      - {p: 1, q: 0, fourier_order_annual: 0}
      - {p: 0, q: 1, fourier_order_annual: 2}
      - {p: 1, q: 1, fourier_order_annual: 2}
      - {p: 1, q: 1, fourier_order_annual: 6}
    wrapper_config:
      min_rows_required: 18
      random_seed: 42

# ---------------------------------------------------------------------------
# NeuralProphet (torch / PyTorch Lightning).
#
# This uses the standard forecaster-level grid search, like every other
# model. The reference implementation this was ported
# from already selected by held-out MAPE, which is exactly what
# hyperparameter_grid does, so no self-tuning wrapper is needed.
#
# n_lags is fixed at 0 (no autoregression) in v1: NeuralProphet fixes
# n_forecasts at construction while BaseModel is fit-once/predict-any-horizon,
# and an AR model scored against a frame containing real held-out actuals is not
# comparable to the other models (it would be over-weighted by inverse-MAPE
# ensembling). See models/neuralprophet_wrapper.py for the full reasoning.
#
# Both learning_rate AND epochs are pinned: leaving either as None makes
# NeuralProphet run a learning-rate range test and auto-size epochs, which is
# slow and makes two runs on the same data non-comparable.
#
# yearly_seasonality is "auto", NOT true -- forcing yearly seasonality on
# short history has produced unusable forecasts twice in this project, once
# for Prophet and once for SARIMAX's annual Fourier terms.
#
# The grid and trend settings come from a synthetic sweep in which a
# narrower setup (50-100 epochs, default changepoints) made NeuralProphet the
# consistent outlier -- badly on a mid-series level shift (18.7% vs ~2%) and
# on strong seasonality -- while the structural models fit those clean
# signals near-perfectly. The cause was under-fitting: a neural model trained
# by SGD needs more epochs to converge, and the trend needs flexibility to
# track a level shift. So the grid spans a middle learning rate (0.03) and
# higher epochs (150/300), and the trend gets more changepoints
# (n_changepoints), while changepoints_range stays at its 0.8 default -- see
# the inline note below for why 0.9 was rejected. The grid selects the best
# by validation score, so a setting that overfits a given dataset simply
# won't be chosen. n_lags stays 0 (the
# fit-once/predict-any-horizon comparability constraint -- see the wrapper).
neuralprophet:
  daily:
    base_hyperparameters:
      n_lags: 0
      yearly_seasonality: auto
      weekly_seasonality: true
      daily_seasonality: false
      impute_missing: true
      n_changepoints: 20         # up from the default (~5-10): finer trend so a
      changepoints_range: 0.8    # level shift can be tracked, not smoothed over.
                                 # Kept at the 0.8 default (not 0.9): allowing
                                 # changepoints into the last 10-20% left a short,
                                 # noisy final trend segment that extrapolated
                                 # badly on smooth-trend series (a regression seen
                                 # on negative_effect_driver); a mid-series shift
                                 # at ~60% is still well inside 0.8.
      accelerator: cpu          # pinned so MPS and CPU-only machines agree
      # REQUIRED, not an optimisation. With metrics enabled, NeuralProphet
      # attaches a Lightning logger, which makes trainer.fit() run
      # _log_hyperparams() -> save_hparams_to_yaml() -> OmegaConf.save().
      # OmegaConf then rejects ConfigTrain's
      # `loss_func: Union[str, _Loss, Callable]` and fit() dies outright.
      # False makes configure_trainer() set `logger = False`, so that path
      # never runs. We compute MAPE in the orchestrator and never read
      # NeuralProphet's training metrics, so nothing is lost -- and NP's own
      # docs note metrics collection slows training down.
      collect_metrics: false
      freq: auto                # wrapper-level; never passed to the constructor
    hyperparameter_grid:
      - {learning_rate: 0.01, epochs: 150}
      - {learning_rate: 0.03, epochs: 150}
      - {learning_rate: 0.10, epochs: 150}
      - {learning_rate: 0.01, epochs: 300}
      - {learning_rate: 0.03, epochs: 300}
      - {learning_rate: 0.10, epochs: 300}
    wrapper_config:
      min_rows_required: 30
      random_seed: 42
  weekly:
    base_hyperparameters:
      n_lags: 0
      yearly_seasonality: auto
      weekly_seasonality: false   # meaningless at weekly granularity
      daily_seasonality: false
      impute_missing: true
      n_changepoints: 10          # fewer than daily -- weekly series are shorter,
      changepoints_range: 0.8     # so too many changepoints would overfit
                                  # (0.8 default -- see the daily block's note on
                                  # why not 0.9)
      accelerator: cpu
      collect_metrics: false    # required -- see the daily block's note
      freq: auto
    hyperparameter_grid:
      - {learning_rate: 0.01, epochs: 150}
      - {learning_rate: 0.03, epochs: 150}
      - {learning_rate: 0.10, epochs: 150}
      - {learning_rate: 0.01, epochs: 300}
      - {learning_rate: 0.03, epochs: 300}
      - {learning_rate: 0.10, epochs: 300}
    wrapper_config:
      min_rows_required: 16
      random_seed: 42

# ---------------------------------------------------------------------------
# Bayesian PyMC (NUTS/MCMC).
#
# A Bayesian structural model: linear trend + Fourier seasonality (annual
# for both frequencies once a fit spans 183 days, plus a weekly cycle for
# daily) + a linear regression
# on the independent columns, observed through a Student-T likelihood. All
# of that lives in models/bayesianpymc_wrapper.py; the adapter only hands
# over "ds", raw "y", and standardised exog.
#
# Like the other models it uses the standard forecaster-level grid search,
# but NUTS sampling is expensive, so the grid is deliberately SMALL. Both
# frequencies vary the Fourier order (n_fourier); daily pairs it with
# beta_fourier_sigma at a fixed target_accept, while weekly varies
# target_accept instead -- see the daily-regime note below for why. Every candidate is sampled at full draws -- no
# cheap-selection shortcut -- so a candidate's MAPE reflects the exact
# posterior it would produce in a real forecast. Expect this model to take
# meaningfully longer than the others.
#
# DAILY vs WEEKLY settings differ, on purpose. Weekly (short history, a
# single annual cycle) samples cleanly and fast at the reference
# implementation's 2000/2000 draws. Daily is a heavier regime: ~1000+ rows, and BOTH an
# annual and a weekly Fourier basis that compete with any independent
# columns which themselves track the annual cycle (the exact overlap SARIMAX
# already warns about -- a seasonal spend or stockout driver, say). With enough
# warmup the posterior is fine (0 divergences, R-hat ~1.0), but that
# collinear ridge makes NUTS take very deep leapfrog trees, so cost per draw
# is large -- a full-draw daily run took ~an hour. The daily block therefore:
#   (a) halves draws/tune to 1000 -- draws/tune control estimation precision,
#       not the model, and 1000 is empirically plenty here (point MAPE moved
#       <0.2pp vs 2000), so this is a near-free ~2x speedup;
#   (b) keeps the Fourier order low (3-4 daily, never 6, which was slowest
#       and never won). n_fourier is the ANNUAL order; the wrapper caps
#       the weekly cycle at 3, since on whole days order 4 only repeats
#       order 3, and leaves the annual terms out of any fit spanning
#       fewer than 183 days (see bayesianpymc_wrapper.py); and
#   (c) GRID-SELECTS beta_fourier_sigma (0.3 tight vs 1.0 loose) rather than
#       hardcoding it. A tight Fourier prior regularises the collinear ridge
#       (faster, and better when seasonality is weak/noisy/collinear); a loose
#       one preserves strong, well-supported seasonality. Which wins is
#       data-dependent -- neither is universally better -- so, exactly like
#       n_fourier and Prophet's yearly_seasonality, it belongs in the grid and
#       the grid picks it per dataset on validation score. (Weekly leaves it at the
#       wrapper's 1.0 default; it samples cheaply and had no ridge problem.)
# cores=1 keeps runs reproducible and avoids multiprocessing issues in the test suite.
bayesianpymc:
  daily:
    base_hyperparameters:
      draws: 1000               # halved vs weekly: see the daily-regime note above
      tune: 1000
      chains: 2
      cores: 1
      max_treedepth: 15
      init: adapt_diag
      use_short_seasonal: true    # weekly cycle, meaningful for daily data
    # beta_fourier_sigma is grid-selected here (0.3 tight vs 1.0 loose) -- the
    # data decides via validation score; see note (c) above.
    hyperparameter_grid:
      - {n_fourier: 3, beta_fourier_sigma: 0.3, target_accept: 0.95}
      - {n_fourier: 4, beta_fourier_sigma: 0.3, target_accept: 0.95}
      - {n_fourier: 3, beta_fourier_sigma: 1.0, target_accept: 0.95}
      - {n_fourier: 4, beta_fourier_sigma: 1.0, target_accept: 0.95}
    wrapper_config:
      min_rows_required: 35
      random_seed: 42
  weekly:
    base_hyperparameters:
      draws: 2000
      tune: 2000
      chains: 2
      cores: 1
      max_treedepth: 15
      init: adapt_diag
      use_short_seasonal: false   # no sub-weekly cycle at weekly granularity
    hyperparameter_grid:
      - {n_fourier: 4, target_accept: 0.95}
      - {n_fourier: 2, target_accept: 0.95}
      - {n_fourier: 3, target_accept: 0.90}
    wrapper_config:
      min_rows_required: 18
      random_seed: 42