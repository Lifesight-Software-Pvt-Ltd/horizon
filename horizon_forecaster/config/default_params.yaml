# Default hyperparameters, by model and frequency.
#
# Structure, per model/frequency block:
#   hyperparameter_grid: a LIST of candidate hyperparameter sets. When no
#                        explicit model_params override is given by the
#                        caller, HorizonForecaster.evaluate() fits and
#                        evaluates EVERY candidate on the same train/test
#                        split and automatically selects whichever
#                        achieves the lowest test-set MAPE.
#
#                        The first 4 candidates reflect a combination the
#                        project owner has actually used and found to
#                        work well in practice on datasets with enough
#                        history to support them. The last 2 candidates
#                        use yearly_seasonality='auto' — Prophet's own
#                        data-span-aware setting, which safely disables
#                        yearly seasonality when there isn't enough
#                        history to support it, rather than forcing it on
#                        regardless. This matters concretely: forcing an
#                        explicit yearly_seasonality Fourier order on a
#                        dataset shorter than ~1-2 years was confirmed
#                        (via direct testing) to produce wild,
#                        unconstrained extrapolation — including negative
#                        forecasted values for a strictly positive metric
#                        — since Prophet has nowhere near enough data to
#                        constrain a yearly cycle but tries to fit one
#                        anyway. Including 'auto' candidates lets the
#                        grid search itself naturally favor the safe
#                        fallback on short datasets (where it will score
#                        better) and the tuned aggressive settings on
#                        long datasets (where they should win instead),
#                        rather than hand-coding a data-span threshold.
#   base_hyperparameters: settings applied to EVERY candidate in the
#                        grid, not varied by the search.
#   wrapper_config:      settings consumed by horizon_forecaster's own
#                        wrapper logic, NOT passed to the underlying
#                        library (minimum-rows floor, random seed).
#
# An explicit `model_params` override (passed to HorizonForecaster's
# constructor) always skips the grid search entirely and uses exactly
# what was passed, merged on top of base_hyperparameters.
#
# Only daily/weekly are supported currently, per project scope.

prophet:
  daily:
    base_hyperparameters:
      daily_seasonality: false
    hyperparameter_grid:
      - seasonality_mode: additive
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: multiplicative
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: additive
        yearly_seasonality: 20
        weekly_seasonality: 5
      - seasonality_mode: multiplicative
        yearly_seasonality: 20
        weekly_seasonality: 5
      # Safe fallback candidates for shorter datasets — see note above.
      - seasonality_mode: additive
        yearly_seasonality: auto
        weekly_seasonality: auto
      - seasonality_mode: multiplicative
        yearly_seasonality: auto
        weekly_seasonality: auto
    wrapper_config:
      # Floor: 14 days = 2 full weeks, the earliest point a weekly
      # pattern can even theoretically repeat once. Not a guarantee of a
      # good fit, just a sanity floor below which Prophet is fitting
      # noise, not a pattern.
      min_rows_required: 14
      random_seed: 42

  weekly:
    base_hyperparameters:
      daily_seasonality: false
    # NOTE: weekly_seasonality is included in the first 4 candidates for
    # consistency with the daily grid above, but is arguably not
    # meaningful at weekly granularity (each row already IS a week, so
    # there's no "within-week" pattern to detect). The safe fallback
    # candidates below explicitly disable it rather than using 'auto',
    # since we already know structurally it shouldn't apply here.
    hyperparameter_grid:
      - seasonality_mode: additive
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: multiplicative
        yearly_seasonality: 10
        weekly_seasonality: 3
      - seasonality_mode: additive
        yearly_seasonality: 20
        weekly_seasonality: 5
      - seasonality_mode: multiplicative
        yearly_seasonality: 20
        weekly_seasonality: 5
      # Safe fallback candidates for shorter datasets — see note above.
      - seasonality_mode: additive
        yearly_seasonality: auto
        weekly_seasonality: false
      - seasonality_mode: multiplicative
        yearly_seasonality: auto
        weekly_seasonality: false
    wrapper_config:
      # Floor: 8 weeks (~2 months), the point below which there isn't
      # enough span to estimate a trend + any real pattern, as opposed
      # to just curve-fitting a line through noise.
      min_rows_required: 8
      random_seed: 42

# CatBoost hyperparameters, by frequency.
#
# Structure mirrors the prophet block above exactly (base_hyperparameters
# / hyperparameter_grid / wrapper_config) — same generic grid-search
# mechanics in HorizonForecaster.evaluate() apply unchanged, which is
# itself a real test of whether that mechanism actually generalizes
# across genuinely different model types, not just a second copy of it.
#
# hyperparameter_grid here is the full cartesian product of the ranges
# below (a grid the project owner has used successfully before), kept
# as the complete 16-combination grid rather than a curated subset,
# plus 2 additional safe/conservative fallback candidates (see the
# note further down, next to those entries) — 18 candidates total:
#   iterations:    [500, 1000]
#   learning_rate: [0.03, 0.1]
#   depth:         [4, 6]
#   l2_leaf_reg:   [1, 3]
#
# NOTE on cost: 18 candidates is materially more expensive per
# evaluate()/forecast() call than Prophet's 6-candidate grid. Accepted
# deliberately (not an oversight) — performance/thoroughness was
# explicitly prioritized over grid-search runtime for this model.
#
# NOTE on random_seed/verbose: these are NOT part of the grid or
# base_hyperparameters, on purpose. CatBoostWrapper's constructor takes
# random_seed as an explicit wrapper-level argument (same pattern as
# ProphetWrapper) and hardcodes verbose=False directly on the
# CatBoostRegressor call. Putting either key in params too would collide
# with those and raise "got multiple values for keyword argument" —
# exactly the class of bug Prophet's random_seed had before it was
# filtered out in Phase 2. Both live under wrapper_config instead, never
# under base_hyperparameters/hyperparameter_grid.
catboost:
  daily:
    base_hyperparameters:
      loss_function: MAE
      # MAPE as CatBoost's own eval_metric, not just this project's
      # external evaluation metric — keeps what the model itself
      # optimizes/monitors during training consistent with how it's
      # judged afterward by evaluate().
      eval_metric: MAPE
    hyperparameter_grid:
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      # Safe fallback candidates for short/small datasets — see note
      # above. Unlike Prophet's 'auto' fallback (which was added to fix
      # a confirmed, dramatic 802%-MAPE catastrophic failure), direct
      # testing here did NOT find an equally dramatic failure mode for
      # the aggressive candidates on short CatBoost data — differences
      # between aggressive and conservative candidates were marginal and
      # inconsistent across seeds (a few points of MAPE either way, not
      # an order-of-magnitude blowup). Included anyway as low-cost
      # insurance: shallower trees, fewer rounds, stronger L2
      # regularization, so the grid search has a genuinely
      # low-capacity option to fall back to if a future dataset shape
      # does trigger real overfitting that this project's own test
      # datasets didn't happen to surface.
      - iterations: 100
        learning_rate: 0.05
        depth: 2
        l2_leaf_reg: 10
      - iterations: 300
        learning_rate: 0.05
        depth: 3
        l2_leaf_reg: 8
    wrapper_config:
      # Same floor as Prophet's daily config. (Previously this floor
      # applied to rows LEFT AFTER CatBoostAdapter's lag-warmup drop --
      # that mechanism no longer exists since the adapter's redesign
      # away from lag/rolling features, so this is now simply a raw
      # training-row-count floor, identical in meaning to Prophet's.)
      min_rows_required: 14
      random_seed: 42

  weekly:
    base_hyperparameters:
      loss_function: MAE
      eval_metric: MAPE
    hyperparameter_grid:
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 500
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 4
        l2_leaf_reg: 3
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 1
      - iterations: 1000
        learning_rate: 0.1
        depth: 6
        l2_leaf_reg: 3
      # Safe fallback candidates for short/small datasets — see the
      # matching note in the daily block above.
      - iterations: 100
        learning_rate: 0.05
        depth: 2
        l2_leaf_reg: 10
      - iterations: 300
        learning_rate: 0.05
        depth: 3
        l2_leaf_reg: 8
    wrapper_config:
      # Same floor as Prophet's weekly config.
      min_rows_required: 8
      random_seed: 42

# ---------------------------------------------------------------------------
# SARIMAX (statsmodels). Phase 6, Part 1.
#
# Unlike prophet/catboost, SARIMAX has NO hyperparameter_grid: it self-tunes
# inside the wrapper (ADF picks the differencing order d, then a small
# exhaustive order space is scored by MAPE on a validation tail carved out of
# train). forecaster.py therefore runs no grid search for it -- it fits once
# and selects internally. Everything under base_hyperparameters is interpreted
# by SARIMAXWrapper itself (NOT passed to any statsmodels constructor blindly);
# wrapper_config carries only the two settings forecaster.py forwards
# explicitly (min_rows_required, random_seed).
#
# Annual seasonality is handled by Fourier exog terms built in SARIMAXAdapter
# (both frequencies). Daily additionally uses a cheap weekly SARIMAX seasonal
# order (s=7); weekly disables the SARIMAX seasonal order entirely (a real
# s=52 is prohibitively slow) and leans on the Fourier terms.
sarimax:
  daily:
    base_hyperparameters:
      alpha: 0.05                 # prediction-interval width (yhat_lower/upper)
      log_clip_headroom: 1.5      # last-resort explosion guard: cap log yhat at train_max + this
      p_max: 1                    # AR/MA order caps (kept small: higher is exponentially slower)
      q_max: 1
      seasonal_cap: 1             # seasonal P/Q caps
      seasonal_period: 7          # weekly seasonality for daily data
      use_seasonal: true
      validation_fraction: 0.15   # tail of train scored by MAPE to pick the order
      min_validation_rows: 7
      maxiter_search: 30          # cheap fits during the order search
      maxiter_final: 150          # thorough fit of the winning order
      enforce_stationarity_final: true
    wrapper_config:
      min_rows_required: 35
      random_seed: 42
  weekly:
    base_hyperparameters:
      alpha: 0.05
      log_clip_headroom: 1.5
      p_max: 1
      q_max: 1
      seasonal_cap: 0
      seasonal_period: 52
      use_seasonal: false         # Fourier terms handle the yearly cycle; no s=52 SARIMAX order
      validation_fraction: 0.15
      min_validation_rows: 4
      maxiter_search: 30
      maxiter_final: 150
      enforce_stationarity_final: true
    wrapper_config:
      min_rows_required: 18
      random_seed: 42